# Hourly SHARDED self-healing refresh (docs/research/SCALING.md §4.6 item 3, docs/adr/0008).
#
#   prepare  → note the pipeline-state commit; pack enabled cities into shards (`gotc shards`)
#   shard ×N → restore that state; fetch only the shard's cities (`gotc run --cities … --no-build`);
#              export a delta DB + the new raw payloads as an artifact. Shards never build, never call
#              Nominatim, never push.
#   publish  → restore the same state; merge every delta (`gotc state merge`); doctor → build (incremental)
#              → export → contract tests (scripts/loop.sh with --no-fetch); deploy Pages once; persist state
#              in one force-push; open/close source issues.
#
# A failed shard doesn't block publishing: its cities keep their last-known-good data (marked stale past the
# SLA), and its units are simply due again next hour.
#
# Fallback: `refresh-monolithic.yml` (manual) is the previous single-job workflow. Same concurrency group.
# One-time setup (repo Settings) is unchanged: Pages → Source "GitHub Actions"; Actions → Workflow permissions
# "Read and write"; optional secrets TICKETMASTER_API_KEY, SEATGEEK_CLIENT_ID, RUNSIGNUP_API_REG, RUNSIGNUP_API_REG_SECRET, EVENTBRITE_TOKEN, SOCRATA_APP_TOKEN.
name: Refresh data
on:
  schedule: [{ cron: "17 * * * *" }]
  workflow_dispatch:
    inputs:
      shard_size: { description: "cities per shard (approx.)", required: false, default: "4" }
permissions: { contents: write, pages: write, id-token: write, issues: write }
concurrency: { group: refresh, cancel-in-progress: false }
env:
  GOTC_USER_AGENT: "GetOffTheCouch/0.1 (+https://github.com/${{ github.repository }})"

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      state_sha: ${{ steps.state.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync && uv pip install -e .
      - id: state
        name: Pin the pipeline-state commit every job will use
        run: echo "sha=$(git ls-remote origin refs/heads/pipeline-state | cut -f1)" >> "$GITHUB_OUTPUT"
      - id: plan
        name: Plan shards
        env: { SIZE: "${{ inputs.shard_size || '4' }}" }
        run: |
          matrix=$(.venv/bin/python -m gotc shards --size "$SIZE")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  shard:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync && uv pip install -e .
      - name: Restore pipeline state
        env: { SHA: "${{ needs.prepare.outputs.state_sha }}" }
        run: |
          mkdir -p data/raw out
          if [ -n "$SHA" ] && git fetch --depth=1 origin "$SHA"; then
            git show "$SHA:gotc.db.gz" | gunzip > data/gotc.db && echo "restored DB at $SHA"
          else
            echo "no pipeline-state branch yet; starting fresh"
          fi
      - name: Fetch this shard's cities
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          RUNSIGNUP_API_REG: ${{ secrets.RUNSIGNUP_API_REG }}
          RUNSIGNUP_API_REG_SECRET: ${{ secrets.RUNSIGNUP_API_REG_SECRET }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          CITIES: ${{ matrix.cities }}
          SHARD: ${{ matrix.shard }}
        run: |
          .venv/bin/python -m gotc state mark > out/base.json
          sleep 1
          .venv/bin/python -m gotc run --cities "$CITIES" --no-build --max-minutes 20 --trigger shard
          .venv/bin/python -m gotc state delta --base out/base.json --cities "$CITIES" --out "out/delta-$SHARD.db"
          (cd data && find raw -type f -newer ../out/base.json -print0 | tar --null -czf "../out/raw-$SHARD.tgz" -T -)
          gzip -9 "out/delta-$SHARD.db" && ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: "shard-${{ matrix.shard }}", path: out/, retention-days: 1 }

  publish:
    needs: [prepare, shard]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60   # build 50 cities + share cards + ~16k pre-rendered pages + a ~700 MB Pages upload
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync && uv pip install -e .
      - name: Restore pipeline state
        env: { SHA: "${{ needs.prepare.outputs.state_sha }}" }
        run: |
          mkdir -p data/raw
          if [ -n "$SHA" ] && git fetch --depth=1 origin "$SHA"; then
            git show "$SHA:gotc.db.gz" | gunzip > data/gotc.db && echo "restored DB at $SHA"
          else
            echo "no pipeline-state branch yet; starting fresh"
          fi
      - uses: actions/cache/restore@v4
        with: { path: data/raw, key: "raw-${{ github.run_id }}", restore-keys: "raw-" }
      - uses: actions/download-artifact@v4
        with: { pattern: "shard-*", path: shards, merge-multiple: true }
      - name: Merge shard deltas
        run: |
          shopt -s nullglob
          for t in shards/raw-*.tgz; do tar -xzf "$t" -C data; done
          deltas=()
          for d in shards/delta-*.db.gz; do gunzip -k "$d" && deltas+=("${d%.gz}"); done
          if [ ${#deltas[@]} -eq 0 ]; then echo "::warning::no shard deltas (every shard failed?)"; exit 0; fi
          .venv/bin/python -m gotc state merge "${deltas[@]}" || echo "::warning::a shard delta was refused (see log)"
      - name: Self-healing loop (build + export; shards already fetched)
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          RUNSIGNUP_API_REG: ${{ secrets.RUNSIGNUP_API_REG }}
          RUNSIGNUP_API_REG_SECRET: ${{ secrets.RUNSIGNUP_API_REG_SECRET }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          GOTC_RUN_ARGS: "--no-fetch"
          GOTC_GEOCODE_BUDGET: "10"   # Census single-line lookups per city per run (the batch call is separate); 50 cities × 10 keeps publish well inside its timeout while the cache fills. Nominatim stays off (docs/SOURCES.md)
          GOTC_RAW_RETENTION_DAYS: "7"
        run: bash scripts/loop.sh
      - name: Job summary
        if: always()
        run: cat docs/HEALTH.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Issues for quarantined sources
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: .venv/bin/python scripts/health_issues.py
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - name: Restore share-card cache (I-115; unchanged cards aren't re-rendered)
        uses: actions/cache/restore@v4
        with: { path: data/og-cache, key: "og-${{ github.run_id }}", restore-keys: "og-" }  # newest day's cache
      - name: Build dashboard with fresh data
        working-directory: web
        env: { GOTC_BASE: "/GetOffTheCouch/", GOTC_SITE_ORIGIN: "https://lachlanspangler.github.io" }
        run: |
          ../.venv/bin/python -m gotc demo && npm ci
          start=$(date +%s)
          npm run build
          echo "build (vite + share cards + pre-render): $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
          cat dist/og/report.json >> "$GITHUB_STEP_SUMMARY" || true
      - id: ogday
        if: always()
        run: echo "key=og-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Save share-card cache (once a day; later runs re-render only the few cards that changed since)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with: { path: data/og-cache, key: "${{ steps.ogday.outputs.key }}" }
      - name: Check pre-rendered pages (SEO + size budgets)
        working-directory: web
        run: (node scripts/check-dist.mjs --warn && node scripts/check-budgets.mjs --warn) >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Persist pipeline state
        if: always()
        run: |
          [ -f data/gotc.db ] || exit 0
          tmp=$(mktemp -d)
          .venv/bin/python scripts/slim_state.py data/gotc.db "$tmp/gotc.db"
          gzip -9 -c "$tmp/gotc.db" > "$tmp/gotc.db.gz" && rm "$tmp/gotc.db"
          cd "$tmp" && git init -q -b pipeline-state && git add gotc.db.gz \
            && git -c user.name=gotc-bot -c user.email=gotc-bot@users.noreply.github.com commit -qm "pipeline state $(date -u +%FT%TZ)" \
            && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pipeline-state
      - id: day
        if: always()
        run: echo "key=raw-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
      - name: Save raw payloads (per run; restore-keys picks up the newest, retention prunes the store)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with: { path: data/raw, key: "${{ steps.day.outputs.key }}" }
