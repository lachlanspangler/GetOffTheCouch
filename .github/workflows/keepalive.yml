# Keep the hourly schedule alive. GitHub disables scheduled workflows in a public repo after 60 days without
# repository activity, and the bot's force-pushes to the orphan `pipeline-state` branch may not count
# (docs/research/SCALING.md §4.2). Once a month this re-enables the scheduled workflows through the REST API
# (no commits to main). If GitHub disables them anyway, `gotc doctor` warns about missed runs in HEALTH.md and
# one click in the Actions tab ("Enable workflow") restores them.
name: Keep schedules alive
on:
  schedule: [{ cron: "41 3 1 * *" }]   # 03:41 UTC on the 1st of every month
  workflow_dispatch:
permissions: { actions: write }
jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable scheduled workflows
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}" }
        run: |
          for wf in refresh.yml keepalive.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable" && echo "enabled $wf"
          done
          gh api "repos/$REPO/actions/workflows/refresh.yml" --jq '"refresh.yml state: \(.state)"'
