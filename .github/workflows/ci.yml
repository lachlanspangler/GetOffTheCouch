# CI: everything `make check` runs, plus browser smoke tests on the demo dataset. No network sources are hit.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen || uv sync
      - run: uv pip install -e .
      - name: Lint + format
        run: .venv/bin/ruff check gotc tests && .venv/bin/ruff format --check gotc tests
      - name: Types (mypy --strict)
        run: .venv/bin/mypy
      - name: Tests (unit, adapter fixtures, contract, integration)
        run: .venv/bin/python -m pytest --cov=gotc --cov-report=term-missing:skip-covered
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: astral-sh/setup-uv@v5
      - run: uv sync && uv pip install -e .
      - run: npm ci
        working-directory: web
      - name: Schema → types are in sync
        run: .venv/bin/python -m gotc schema && (cd web && npm run gen:types) && git diff --exit-code schema web/src/lib/feed.generated.ts web/src/lib/details.generated.ts
      - name: Demo dataset (fictional, frozen clock)
        run: .venv/bin/python -m gotc demo --anchor 2026-10-16T15:00:00+00:00
      - run: npm run typecheck && npm test && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium && npx playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/test-results }
