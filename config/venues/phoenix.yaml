# Curated venue locations for phoenix (loaded by gotc/pipeline/build.py load_curated_venues).
# Location-only entries: `address` is copied from the operator's official locations page (`address_source`,
# fetched with the GetOffTheCouch UA, robots.txt checked); lat/lon come from the U.S. Census geocoder
# (scripts/venue_geocode.py, `coords_source`). Addresses Census can't match stay without coordinates.
# Phoenix Public Library's LibCal LOCATIONs are "Room, Branch"; `venue_part: last` makes the branch the venue.
# Desert Botanical Garden is deliberately absent: Census has no match for 1201 N Galvin Pkwy and dbg.org now
# answers with a Cloudflare challenge (never retried).
