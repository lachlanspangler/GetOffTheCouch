# Global source registry + freshness SLAs. City-specific sources live in config/cities/<slug>.yaml.
#
# sla_hours: how old data of each type may be before the UI marks it stale. A unit's default fetch cadence
# equals its SLA (override with cadence_hours). Ticket prices move hourly; cons/faires barely move weekly.
sla_hours:
  ticket_prices: 4
  concerts: 12
  events: 24
  recurring: 48
  leagues: 24
  volunteer: 24
  openings: 24
  conventions: 168

sources:
  - id: ticketmaster
    adapter: ticketmaster
    name: Ticketmaster
    data_type: ticket_prices
    scope: all_cities
    cadence_hours: 6          # 10 cities × ~12 calls = ~480 calls/run, well under 5,000/day at 4 runs/day
    requires: [TICKETMASTER_API_KEY]
    homepage: https://developer.ticketmaster.com/
    expect_min_records: 5
    params: { horizon_days: 120, window_days: 14 }

  - id: seatgeek
    adapter: seatgeek
    name: SeatGeek
    data_type: ticket_prices
    scope: all_cities
    cadence_hours: 4
    requires: [SEATGEEK_CLIENT_ID]
    homepage: https://platform.seatgeek.com/
    expect_min_records: 5
    params: { horizon_days: 120, max_pages: 20 }

  # UpcomingCons: national list pages with schema.org Event microdata; each city keeps its own cons (locality +
  # state match against the city name/aliases). One global source instead of 10 identical per-city entries.
  - id: upcomingcons
    adapter: upcomingcons
    name: UpcomingCons
    data_type: conventions
    scope: all_cities
    cadence_hours: 168
    min_interval_s: 3
    homepage: https://www.upcomingcons.com/
    expect_min_records: 0       # a city with no con on the list is normal, not a failure
    params:
      base_url: https://www.upcomingcons.com
      pages: [anime-cons, comic-conventions, gaming-conventions, science-fiction-conventions]  # union, deduped
      extra_localities:
        chicago: [Rosemont, Schaumburg]

  # Maker Faire global map JSON. Keyless + robots-allowed, but Cloudflare serves our client a 403 challenge
  # (2026-10-16) — disabled until Make: confirms access. Never work around the challenge.
  - id: makerfaire
    adapter: makerfaire
    name: Maker Faire
    data_type: conventions
    scope: all_cities
    cadence_hours: 168
    enabled: false
    homepage: https://makerfaire.com/globalmap/
    expect_min_records: 0
    notes: "403 Cloudflare challenge to PoliteClient on 2026-10-16 (robots.txt allows /query/)."
    params:
      url: https://makerfaire.com/query/?type=map
      categories: [Featured, Flagship, Mini]

  # RunSignup "Get Races" REST API: upcoming races with registration periods = published deadlines for every
  # city. Keyless technically, but the API Terms of Use require registering as an API caller first ("You must
  # register and agree to these Terms before accessing the RunSignup API"), so the unit waits for the free
  # caller registration (RUNSIGNUP_API_REG + RUNSIGNUP_API_REG_SECRET; STATUS.md "Keys needed"). ZIP + radius
  # around each city center; runsignup.com/robots.txt allows /Rest/ (api.runsignup.com is Disallow: /, unused).
  - id: runsignup
    adapter: runsignup
    name: RunSignup races
    data_type: events
    scope: all_cities
    cadence_hours: 24
    min_interval_s: 2           # API terms: at most 2 concurrent calls; we stay sequential and slow
    requires: [RUNSIGNUP_API_REG, RUNSIGNUP_API_REG_SECRET]
    homepage: https://runsignup.com/Races/Search
    expect_min_records: 1
    params:
      url: https://runsignup.com/Rest/races
      horizon_days: 120
      results_per_page: 100
      max_pages: 5
      zipcodes:   # a downtown ZIP per city; radius = the city's radius_km in miles
        austin: "78701"
        baltimore: "21202"
        boston: "02108"
        chicago: "60602"
        dallas: "75201"
        denver: "80202"
        houston: "77002"
        los_angeles: "90012"
        miami: "33130"
        minneapolis: "55401"
        nashville: "37201"
        nyc: "10007"
        san_antonio: "78205"
        seattle: "98101"
        washington_dc: "20004"
