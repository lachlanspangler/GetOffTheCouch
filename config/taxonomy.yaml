# GetOffTheCouch category taxonomy. Categories are ids, never free text.
# Rules:
#   * ids are dotted paths; a child inherits its parent's traits unless overridden
#   * `social` (0–1) = prior for "good for meeting people" (see gotc/pipeline/enrich.py)
#   * `attendance` = [p10, p50, p90] prior headcount when we know nothing else (used by the attendance model)
#   * `match` = case-insensitive keywords/phrases used by gotc/taxonomy.py to classify free text
#     when a source gives no usable category. Source-specific label maps live in the adapters' configs.
#   * never delete an id: deprecate it with `deprecated: <replacement id>` so stored data stays valid
version: 1

categories:
  music:
    label: Music
    icon: music
    social: 0.35
    attendance: [80, 600, 8000]
    children:
      concert: { label: Concerts, match: [concert, live music, tour, in concert], attendance: [150, 1200, 15000] }
      festival: { label: Music festivals, match: [music festival, fest lineup], attendance: [1500, 8000, 60000], social: 0.5 }
      open_mic: { label: Open mics & jams, match: [open mic, open-mic, jam session, bluegrass jam], attendance: [15, 40, 120], social: 0.7 }
      dj_night: { label: DJ & dance nights, match: [dj set, dance party, " rave", silent disco, techno, house music], attendance: [80, 300, 1500], social: 0.55 }
