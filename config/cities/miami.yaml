# Miami, FL (Miami-Dade). Neighborhood points are approximate centroids, used only for "near me" distance filters.
# Openings: the only verified signal is the Florida DBPR ABT CSV extracts (no CSV adapter yet; see the ideas
# ledger). Sources verified live 2026-10-15/16 (see docs/research/city_open_data.md §3.9 and docs/SOURCES.md).
slug: miami
name: Miami
state: FL
timezone: America/New_York
center: [25.7617, -80.1918]
radius_km: 30
aliases: [Miami-Dade, Miami Beach, South Beach, Coral Gables, Hialeah, Doral, North Miami, Key Biscayne, Coconut Grove, Homestead, Aventura]
neighborhoods:  # approximate centroids
  - { name: Downtown / Brickell, lat: 25.7650, lon: -80.1936 }
  - { name: Wynwood, lat: 25.8010, lon: -80.1990 }
  - { name: Edgewater, lat: 25.7990, lon: -80.1880 }
  - { name: Design District, lat: 25.8130, lon: -80.1930 }
  - { name: Little Havana, lat: 25.7740, lon: -80.2190 }
  - { name: Little Haiti, lat: 25.8300, lon: -80.1950 }
  - { name: Coconut Grove, lat: 25.7280, lon: -80.2420 }
  - { name: Coral Gables, lat: 25.7215, lon: -80.2684 }
  - { name: South Beach, lat: 25.7826, lon: -80.1340 }
  - { name: Mid-Beach / North Beach, lat: 25.8500, lon: -80.1220 }
  - { name: Allapattah, lat: 25.8130, lon: -80.2230 }
  - { name: Kendall, lat: 25.6793, lon: -80.3173 }
  - { name: Doral, lat: 25.8195, lon: -80.3553 }
  - { name: Hialeah, lat: 25.8576, lon: -80.2781 }
  - { name: North Miami, lat: 25.8901, lon: -80.1867 }
sources:
  - id: mdpls_events
    adapter: communico
    name: Miami-Dade Public Library System events
    data_type: events
    homepage: https://www.mdpls.org/events
    expect_min_records: 30
    notes: Undocumented Communico calendar JSON (robots allows it); one request per day of horizon, daily.
    params:
      base_url: https://www.mdpls.org
      horizon_days: 7
      venue_label: Miami-Dade Public Library
      default_category: arts.books
      category_map:   # tag/age labels seen in the live feed; checked in this order (types before audiences)
        Art Exhibition: arts.museum
        Book Clubs: arts.books
        Author Event: arts.books
        Storytime: family.kids
        Movies: arts.film
        Music: music.concert
        "Performances & Presentations": arts.theater
        Games: trivia_games.board_games
        Language Learning: learning.language
        Conversation Circles: learning.language
        "Computers & Technology": learning.tech
        "Arts & Crafts": arts.workshop
        "Health & Wellness": fitness.yoga
        "Early Childhood (0-5)": family.kids
        "Children (6-11)": family.kids

  - id: fiu_events
    adapter: localist
    name: FIU events
    data_type: events
    homepage: https://calendar.fiu.edu/
    expect_min_records: 10
    params:
      fallback_point: { lat: 25.7562, lon: -80.3755, label: "FIU Modesto Maidique campus" }   # unmappable rooms → campus, labeled approximate
      audience_filter: institution   # skip faculty/student-only items
      base_url: https://calendar.fiu.edu
      horizon_days: 30
      max_pages: 5
      organizer: Florida International University
      default_category: learning.networking

  # ── leagues / volunteering / Luma (merged from the adapters branch; see docs/sources_additions.md) ──
  - id: volo_miami
    adapter: volo
    name: Volo Sports Miami
    data_type: leagues
    min_interval_s: 3
    homepage: https://www.volosports.com/discover/miami?category=leagues
    expect_min_records: 1
    params:
      base_url: https://www.volosports.com
      city_slug: miami
      max_pages: 4
  - id: luma_mana_tech
    adapter: ics
    name: Mana Tech Events (Luma)
    data_type: events
    cadence_hours: 12
    homepage: https://luma.com/miami
    expect_min_records: 1
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-NgTwepzMKeP3Xlg
      horizon_days: 45
      organizer: Mana Tech
      default_category: learning.tech
  - id: luma_run_gables
    adapter: ics
    name: RUN GABLES (Luma)
    data_type: recurring
    cadence_hours: 12
    homepage: https://luma.com/miami
    expect_min_records: 1
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-GC5KnPoGH2C76rp
      horizon_days: 45
      organizer: RUN GABLES
      default_category: fitness.run_club
  # ── concerts: venues' own public calendars (keyless; research 2026-10-16, docs/sources_concerts.md) ──
  - id: miami_beach_bandshell
    adapter: tribe
    name: Miami Beach Bandshell (Rhythm Foundation calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 10   # robots Crawl-delay: 10
    homepage: https://miamibeachbandshell.com/events/
    expect_min_records: 5
    notes: City-owned bandshell run by the nonprofit Rhythm Foundation; The Events Calendar REST API.
    params:
      base_url: https://miamibeachbandshell.com
      horizon_days: 120
      per_page: 50
      max_pages: 4
      organizer: Rhythm Foundation
      venue: {name: Miami Beach Bandshell, address: "7275 Collins Avenue, Miami Beach, FL 33141"}  # miamibeachbandshell.com footer
      default_category: music.concert
      classify_description: false
  - id: bayfront_park_miami
    adapter: jsonld
    name: Bayfront Park (Bayfront Park Management Trust calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://www.bayfrontparkmiami.com/events
    expect_min_records: 5
    notes: >-
      City of Miami trust; Squarespace Event JSON-LD per event page. Mix of amphitheater concerts and park
      events, so the title classifier decides and concerts are the default. `follow` skips ?format=ical.
    params:
      urls: [https://www.bayfrontparkmiami.com/events]
      follow: 'bayfrontparkmiami\.com/events/[^/?#]+$'
      max_follow: 40
      venue: {name: Bayfront Park}
      organizer: Bayfront Park Management Trust
      default_category: music.concert

  # ── openings (Florida DBPR alcoholic-beverage license extract; csvfile adapter) ──
  - id: fl_dbpr_openings_miami
    adapter: csvfile
    name: Florida DBPR new on-premises liquor licenses (Miami-Dade)
    data_type: openings
    homepage: https://www2.myfloridalicense.com/alcoholic-beverages-and-tobacco/public-records/
    expect_min_records: 5
    notes: >-
      Statewide retail beverage license extract (bd4006lic.csv, ~14 MB, header row, rebuilt daily ~10:45 UTC,
      Last-Modified honoured). Newness date = "Original Licensure Date" (never the effective/renewal date).
      Only consumption-on-premises series (1COP/2COP/4COP…) in Location County 23 (Dade); package stores (APS),
      caterers (13CT) and inactive quota licenses held in escrow ("NO CITY CODE") are left out. "Owner Name"
      (often a person) is dropped by the privacy scrub; a DBA that merely repeats it is used only if it looks
      like an organisation. robots.txt allows /sto/ (it blocks only WordPress internals).
    params:
      url: https://www2.myfloridalicense.com/sto/file_download/extracts/bd4006lic.csv
      encoding: [utf-8-sig, cp1252]
      kind: opening
      lookback_days: 60
      window: { field: original_licensure_date }
      legal_name_copies: { dba: owner_name }
      include: { profession: ["4006"], location_county: ["23"] }
      include_regex: { series: "COP$" }
      exclude_regex: { location_city: "(?i)no city code", location_address_1: "(?i)^inactive|\\bescrow\\b" }
      reject_future_start: true
      fields: { record_id: license_number, title: [dba, dba_legal], start: original_licensure_date,
                category: series, address: [location_address_1, location_address_2, location_city, location_state] }
      entity_only_fields: [dba_legal]
      title_template: "{title} — new liquor license"
      description_template: >-
        License signal, not a confirmed opening date. Florida DBPR first licensed this business to serve alcohol
        on the premises (series {series}) on {date}.
      default_category: food_drink.restaurant_opening
      default_url: https://www2.myfloridalicense.com/alcoholic-beverages-and-tobacco/public-records/
      extras: { signal: liquor_license_original_licensure }

  # ── big venues via carbonhouse /events/rss (public syndication feed; robots allows; session 2, I-104) ──
  - id: kaseya_center
    adapter: rss_events
    name: Kaseya Center (venue calendar)
    data_type: concerts
    cadence_hours: 12
    homepage: https://www.kaseyacenter.com/events
    expect_min_records: 10
    params:
      spectator_venue: true
      url: https://www.kaseyacenter.com/events/rss
      horizon_days: 180
      venue: {name: "Kaseya Center", address: "601 Biscayne Blvd, Miami, FL 33132"}
      organizer: Kaseya Center
      default_category: music.concert

  # ── college athletics, home games only (SIDEARM calendar.ics; robots allows; session 2, I-107) ──
  - id: fiu_athletics
    adapter: ics
    name: FIU Panthers athletics (home games)
    data_type: events
    cadence_hours: 24
    homepage: https://fiusports.com/calendar
    expect_min_records: 3
    params:
      url: https://fiusports.com/calendar.ashx/calendar.ics?sport_id=0
      horizon_days: 45
      max_occurrences: 1
      organizer: FIU Athletics
      force_category: sports_watch.game
      exclude_location: '^(?!(Miami)\b)'

  # ── trivia (Challenge Entertainment show-finder JSON; robots allows all, no terms page; session 4 cov2) ──
  - id: challenge_trivia_miami
    adapter: challenge
    name: Challenge Entertainment trivia & music bingo (South Florida)
    data_type: recurring
    cadence_hours: 48
    homepage: https://challengeentertainment.com/
    expect_min_records: 5
    notes: One ~0.9 MB JSON for every show nationwide (wp-json/ce/v1/shows); metro-south-florida within 2× the city radius (mostly Broward; 12 weekly shows on 2026-10-27).
    params:
      url: https://challengeentertainment.com/wp-json/ce/v1/shows
      metros: [south-florida]
