  - id: portland_art_museum
    adapter: tribe
    name: Portland Art Museum & PAM CUT (Tomorrow Theater, Whitsell Auditorium)
    data_type: events
    min_interval_s: 2
    homepage: https://portlandartmuseum.org/events/
    expect_min_records: 10
    notes: >-
      WP The Events Calendar REST API (robots allows; answered 200). The HTML site serves a Cloudflare challenge we
      never attempt. Member-only events are skipped.
    params:
      base_url: https://portlandartmuseum.org
      horizon_days: 45
      max_pages: 4
      venue: {name: Portland Art Museum}
      organizer: Portland Art Museum
      exclude_location: '\bmembers?( only| exclusive)?\b.*\b(event|preview|reception)\b|\bMember (Event|Preview)'
      default_category: arts.museum
      category_map:
        "Screenings & experiences": arts.film
        "Screenings &amp; experiences": arts.film
        Tomorrow Theater: arts.film
        PAM CUT @ The Whitsell: arts.film
        "Lectures & talks": arts.museum
        "Lectures &amp; talks": arts.museum

