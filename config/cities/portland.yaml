# Portland, OR. Neighborhood points are approximate centroids, used only for "near me" distance filters.
# Sources verified live 2026-10-16 (batch B onboarding; see docs/SOURCES.md "Batch B cities").
# Not used (details in docs/SOURCES.md): portland.gov (robots.txt answers 403 = disallow all, so no Portland Parks &
# Recreation calendar); OMSI (robots 403); Travel Portland, Powell's, Hollywood Theatre, Japanese Garden, Star
# Theater, Dante's (Cloudflare challenges); SOLVE volunteer calendar (HandsOn Connect, but its terms forbid "data
# mining, robots or similar data gathering"); Portland'5 / Oregon Convention Center / Metro (Drupal pages, no
# feed or JSON-LD); Mississippi Studios / Revolution Hall (no JSON-LD, Etix links only); PSU calendar (Drupal, no
# feed); no Team Trivia, Challenge (Oregon shows are in Bend/Springfield/Corvallis) or Volo market.
slug: portland
name: Portland
state: OR
timezone: America/Los_Angeles
center: [45.5152, -122.6784]
