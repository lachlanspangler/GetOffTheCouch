sources:
  - id: wccls_events
    adapter: bibliocommons
    name: Washington County Cooperative Library Services events
    data_type: events
    cadence_hours: 24
    min_interval_s: 2
    homepage: https://wccls.bibliocommons.com/v2/events
    expect_min_records: 30
    notes: >-
      BiblioCommons events RSS (gateway host, no robots.txt). Beaverton, Cedar Mill/West Slope/Bethany
      (Portland-addressed), Tigard, Tualatin, Aloha and Hillsboro branches; Forest Grove, Cornelius, Banks and
      Sherwood are dropped by `cities`.
    params:
      library: wccls
      horizon_days: 10
      max_pages: 20
      venue_label: Washington County Libraries
      cities: [Beaverton, Portland, Tigard, Tualatin, Aloha, Hillsboro]
      default_category: arts.books
      category_map:   # labels seen in the live feed; checked in this order (event types before audiences)
        Storytime: family.kids
        Early Literacy: family.kids
        Read to the dogs: family.kids
        Book Group: arts.books
        Writing/Poetry: arts.books
        Author/Speaker: arts.books
        ESL Class: learning.language
        Computer/Technology: learning.tech
        STEM/STEAM: learning.tech
        DIY/Maker/Craft: arts.workshop
        Class/Workshop: arts.workshop
        Games/Play: trivia_games.board_games
        Art/Movie/Performance: arts.theater
        Job/Career: learning.networking
        "Babies / Toddlers / Preschool": family.kids
        Kids: family.kids

  - id: multcolib_events
    adapter: bibliocommons
    name: Multnomah County Library events
    data_type: events
    cadence_hours: 24
    min_interval_s: 2
    enabled: false
    homepage: https://multcolib.bibliocommons.com/v2/events
    expect_min_records: 30
    notes: >-
      DISABLED 2026-10-16: the library's events are on BiblioCommons (multcolib.org links there), but the gateway
      answered HTTP 504 Gateway Time-out even for a one-day window (also seen in the scaling research). Retry later;
      never crawl multcolib.bibliocommons.com itself (Crawl-delay 120).
    params:
      library: multcolib
      horizon_days: 7
      max_pages: 20
      venue_label: Multnomah County Library
      default_category: arts.books

  - id: olcc_new_applications_portland
    adapter: socrata
    name: OLCC liquor license applications received (Portland, on-premises)
    data_type: openings
    homepage: https://data.oregon.gov/d/qad4-bnxp
    expect_min_records: 5
    notes: >-
      Oregon Liquor and Cannabis Commission "Liquor Applications Received" (updated daily). Only
      application_type = 'New Application' (premises amendments excluded) for on-premises licenses at Portland
      addresses; date_received = application received, never a renewal. No coordinates: geocoded from address.
      A new application can also be a change of ownership of an existing bar or restaurant.
    params:
      domain: data.oregon.gov
      dataset: qad4-bnxp
      kind: opening
      lookback_days: 45
      where: >-
        date_received >= '{today}' AND application_type = 'New Application' AND upper(address) like '%PORTLAND OR%'
        AND license_type in('Full On-Premises Sales - Commercial', 'Limited On-Premises Sales', 'Brewery Public House',
        'Brewery Public House Additional Location', 'Winery - Consumption Additional Location',
        'Distillery Tasting Additional Location', 'Brewery - Consumption Additional Location')
      order: date_received DESC
      page_size: 1000
      max_pages: 2
      fields: { title: trade_name, start: date_received, category: license_type, address: address }
      exclude_title: ["(?i)\\b(grocery|mini ?mart|food mart|market|convenience|supermarket|gas|hotel|inn|catering|delivery)\\b"]
      title_template: "{title} — new liquor license application"
      description_template: >-
        License signal, not a confirmed opening date. The Oregon Liquor and Cannabis Commission received a new
        "{license_type}" license application for this address on {date} (status: {application_status}).
      category_rules:
        - { match: "(?i)brewery|distillery|tavern|bar\\b|pub\\b|lounge", category: nightlife.opening }
      default_category: food_drink.restaurant_opening
      default_url: https://data.oregon.gov/d/qad4-bnxp
      extras: { signal: liquor_license_application }

  - id: up_events
    adapter: localist
    name: University of Portland events
    data_type: events
    homepage: https://calendar.up.edu/
    expect_min_records: 10
    params:
      fallback_point: { lat: 45.5718, lon: -122.7270, label: "University of Portland campus" }   # unmappable rooms → campus, labeled approximate
      audience_filter: institution   # skip faculty/student-only items
      base_url: https://calendar.up.edu
      horizon_days: 45
      max_pages: 3
      organizer: University of Portland
      default_category: learning.networking
      exclude_location: '\b(vacation|no classes|classes after|special schedule|last day to|deadline)\b'
      category_map:
        Pilot Athletics: sports_watch.game
        Theater / Dance: arts.theater
        Music: music.concert
        Performance: arts.theater
        Lecture / Presentation / Talk: learning.networking

  - id: portland_pilots_athletics
    adapter: ics
    name: Portland Pilots athletics (home games — Chiles Center, Merlo Field)
    data_type: events
    cadence_hours: 24
    homepage: https://portlandpilots.com/calendar
    expect_min_records: 3
    notes: >-
      University of Portland's SIDEARM Sports subscription calendar (robots allows it, Crawl-delay 30 — one request a
      day). Only events whose LOCATION starts with "Portland" are kept.
    params:
      url: https://portlandpilots.com/calendar.ashx/calendar.ics?sport_id=0
      horizon_days: 45
      max_occurrences: 1
      organizer: Portland Pilots
      exclude_location: '^(?!Portland\b)'
      force_category: sports_watch.game   # spectator games, not rec leagues
      fallback_point: { lat: 45.5718, lon: -122.7270, label: "University of Portland campus" }

  - id: portland_state_athletics
    adapter: ics
    name: Portland State Vikings athletics (home games — Viking Pavilion, Hillsboro Stadium)
    data_type: events
    cadence_hours: 24
    homepage: https://goviks.com/calendar
    expect_min_records: 3
    notes: >-
      Portland State's SIDEARM Sports subscription calendar (robots allows it, Crawl-delay 30). Only events whose
      LOCATION starts with "Portland" or "Hillsboro" (football's home field) are kept.
    params:
      url: https://goviks.com/calendar.ashx/calendar.ics?sport_id=0
      horizon_days: 45
      max_occurrences: 1
      organizer: Portland State Vikings
      exclude_location: '^(?!(Portland|Hillsboro)\b)'
      force_category: sports_watch.game
      fallback_point: { lat: 45.5111, lon: -122.6833, label: "Portland State campus" }

