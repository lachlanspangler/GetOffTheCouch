  - { name: Buckman / Belmont, lat: 45.5160, lon: -122.6450 }
  - { name: Hawthorne, lat: 45.5120, lon: -122.6250 }
  - { name: Division / Richmond, lat: 45.5050, lon: -122.6300 }
  - { name: Alberta Arts, lat: 45.5590, lon: -122.6450 }
