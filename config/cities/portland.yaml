  - { name: Northwest / Nob Hill, lat: 45.5310, lon: -122.6980 }
  - { name: Goose Hollow, lat: 45.5190, lon: -122.6950 }
  - { name: South Waterfront, lat: 45.4990, lon: -122.6720 }
