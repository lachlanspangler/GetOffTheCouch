    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://www.holocene.org/events/
    expect_min_records: 15
    notes: Rockhouse WordPress (like Larimer Lounge); Event JSON-LD per event page with the Etix ticket link.
    params:
      urls: [https://www.holocene.org/events/]
      follow: 'holocene\.org/event/[^/]+/holocene/portland/$'
      max_follow: 40
      venue: {name: Holocene, address: "1001 SE Morrison, Portland, OR"}
      organizer: Holocene
      default_category: music.concert

