# Denver, CO. Neighborhood points are approximate centroids, used only for "near me" distance filters.
# Denver Public Library (LibCal) is robots-disallowed (User-agent: * / Disallow: /), so there is no library source.
# No Localist/LiveWhale university calendar was found (CU Denver, MSU Denver, DU).
# Sources verified live 2026-10-15/16 (see docs/research/city_open_data.md §3.6 and docs/SOURCES.md).
slug: denver
name: Denver
state: CO
timezone: America/Denver
center: [39.7392, -104.9903]
radius_km: 25
aliases: [Mile High City, Aurora, Lakewood, Englewood, Littleton, Arvada, Westminster, Wheat Ridge, Golden, Boulder, Commerce City, Glendale]
neighborhoods:  # approximate centroids
  - { name: Downtown / LoDo, lat: 39.7525, lon: -104.9995 }
  - { name: RiNo, lat: 39.7690, lon: -104.9820 }
  - { name: Five Points, lat: 39.7570, lon: -104.9760 }
  - { name: Capitol Hill, lat: 39.7310, lon: -104.9800 }
  - { name: Cheesman Park, lat: 39.7330, lon: -104.9670 }
  - { name: Highlands (LoHi), lat: 39.7590, lon: -105.0110 }
  - { name: Sloan's Lake, lat: 39.7480, lon: -105.0450 }
  - { name: Baker, lat: 39.7160, lon: -104.9930 }
  - { name: Washington Park, lat: 39.7000, lon: -104.9700 }
  - { name: Cherry Creek, lat: 39.7170, lon: -104.9530 }
  - { name: City Park, lat: 39.7470, lon: -104.9500 }
  - { name: Park Hill, lat: 39.7550, lon: -104.9200 }
  - { name: Berkeley / Tennyson, lat: 39.7760, lon: -105.0440 }
  - { name: Stapleton / Central Park, lat: 39.7600, lon: -104.8800 }
  - { name: University (DU), lat: 39.6780, lon: -104.9620 }
sources:
  - id: visit_denver_events
    adapter: simpleview
    name: Visit Denver events
    data_type: events
    homepage: https://www.denver.org/events/
    expect_min_records: 50
    enabled: false
    notes: >-
      DISABLED 2026-10-16: the events API answered HTTP 403 "Access Denied" (CDN bot protection) to our PoliteClient on the first live run, although robots.txt allows it and the token endpoint worked. A 403 means the site doesn't want automated clients here; we don't work around it. Re-enable only with the board's permission.
    params:
      base_url: https://visitdenver.com
      board: Visit Denver
      horizon_days: 7
      default_category: community.festival

  - id: denver_liquor_openings
    adapter: arcgis
    name: Denver newly issued liquor licenses (on-premises)
    data_type: openings
    homepage: https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services/ODC_BUSN_LIQUORLICENSES_P/FeatureServer/27
    expect_min_records: 1
    notes: >-
      ORIGINAL_ISSUE_DATE = first issuance. Excludes special-event, tasting, store and grocery (3.2 beer) licenses.
      Rows without an address carry placeholder geometry in the California desert; mapped.sane_coords drops it.
    params:
      service_url: https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services/ODC_BUSN_LIQUORLICENSES_P/FeatureServer/27
      kind: opening
      lookback_days: 60
      where: >-
        ORIGINAL_ISSUE_DATE >= DATE '{today_date}' AND LICENSES NOT IN ('LIQUOR - SPECIAL EVENTS',
        'LIQUOR - TASTINGS', 'LIQUOR - STORE', 'LIQUOR - FERMENTED MALT BEVERAGE', 'LIQUOR - LIQUOR LICENSED DRUGSTORE')
      order_by: ORIGINAL_ISSUE_DATE DESC
      fields: { record_id: BFN, title: BUS_PROF_NAME, start: ORIGINAL_ISSUE_DATE, category: LICENSES,
                address: [FULL_ADDRESS, CITY], neighborhood: NEIGHBORHOOD }
      title_template: "{title} — new liquor license"
      description_template: >-
        License signal, not a confirmed opening date. Denver Excise & Licenses first issued a "{LICENSES}" license
        for this address on {date}.
      category_rules:
        - { match: "(?i)tavern|cabaret|brew ?pub|distillery pub|lodging", category: nightlife.opening }
      default_category: food_drink.restaurant_opening
      default_url: https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services/ODC_BUSN_LIQUORLICENSES_P/FeatureServer/27
      extras: { signal: liquor_license_issued }

  - id: denver_pending_food_openings
    adapter: arcgis
    name: Denver pending retail food licenses
    data_type: openings
    homepage: https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services/ODC_pending_business_licenses/FeatureServer/46
    expect_min_records: 5
    notes: >-
      Pending = applied, not yet issued: an early pre-opening signal. geometry is null (State Plane X/Y only), so
      these are geocoded from ADDRESS. Entity_Name (legal entity, may be a person) is never used as a title.
    params:
      service_url: https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services/ODC_pending_business_licenses/FeatureServer/46
      kind: opening
      lookback_days: 60
      where: "License_Type = 'Retail Food' AND TRADE_NAME IS NOT NULL AND APPLICATION_DATE >= DATE '{today_date}'"
      order_by: APPLICATION_DATE DESC
      fields: { record_id: RECORD_ID, title: TRADE_NAME, start: APPLICATION_DATE, category: License_Type,
                address: [ADDRESS, ZIP] }
      exclude_title: ["(?i)\\b(catering|grocery|grocers?|mini ?mart|food mart|convenience|supermarket|gas|vending|commissary)\\b"]
      title_template: "{title} — new restaurant license application"
      description_template: >-
        License signal, not a confirmed opening date. Denver Excise & Licenses received a Retail Food license
        application for this address on {date} (status: {License_Status}).
      default_category: food_drink.restaurant_opening
      default_url: https://services1.arcgis.com/zdB7qR0BtYrg0Xpl/arcgis/rest/services/ODC_pending_business_licenses/FeatureServer/46
      extras: { signal: business_license_application }

  - id: colorado_liquor_openings_denver
    adapter: socrata
    name: Colorado recently approved liquor licenses (Denver)
    data_type: openings
    homepage: https://data.colorado.gov/d/htyp-tqzh
    expect_min_records: 3
    notes: >-
      Known data-quality bug: some rows have issue_date and license_number swapped (issue_date in the 2200s,
      license_number like "2025-05-21"). Those are rejected by `validate` + `reject_future_start`, never shown.
      In this dataset licensee_name holds the trade name and doing_business_as the legal entity (columns swapped).
    params:
      domain: data.colorado.gov
      dataset: htyp-tqzh
      kind: opening
      lookback_days: 60
      where: "upper(city)='DENVER' AND issue_date >= '{today}'"
      order: issue_date DESC
      validate: { license_number: "^\\d{2}-\\d+$" }
      reject_future_start: true
      fields: { record_id: license_number, title: licensee_name, start: issue_date, category: license_type,
                address: [street_address, city] }
      exclude_regex: { license_type: "(?i)tobacco|retail liquor store|liquor-licensed drugstore|fermented malt beverage|wholesale|takeout|delivery|special event|art gallery" }
      exclude_title: ["(?i)\\b(grocery|food mart|convenience|supermarket|gas|liquor store|wine & spirits|liquors)\\b"]
      title_template: "{title} — new liquor license"
      description_template: >-
        License signal, not a confirmed opening date. The Colorado Liquor Enforcement Division approved a
        "{license_type}" license for this address on {date}.
      category_rules:
        - { match: "(?i)tavern|brew ?pub|distillery|lodging", category: nightlife.opening }
      default_category: food_drink.restaurant_opening
      default_url: https://data.colorado.gov/d/htyp-tqzh
      extras: { signal: liquor_license_issued }

  # ── leagues / volunteering / Luma (merged from the adapters branch; see docs/sources_additions.md) ──
  - id: volo_denver
    adapter: volo
    name: Volo Sports Denver
    data_type: leagues
    min_interval_s: 3
    homepage: https://www.volosports.com/discover/denver?category=leagues
    expect_min_records: 1
    params:
      base_url: https://www.volosports.com
      city_slug: denver
      max_pages: 6
  # ── concerts: venues' own public calendars (keyless; research 2026-10-16, docs/sources_concerts.md) ──
  - id: larimer_lounge
    adapter: jsonld
    name: Larimer Lounge (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://larimerlounge.com/
    expect_min_records: 10
    notes: Rockhouse WordPress; Event JSON-LD per event page with the Etix ticket link. Also lists its Tree House / Campground rooms.
    params:
      urls: [https://larimerlounge.com/]
      follow: 'larimerlounge\.com/event/[^/]+/[^/]+/denver-colorado/$'
      max_follow: 40
      venue: {name: Larimer Lounge}
      organizer: Larimer Lounge
      default_category: music.concert
  - id: globe_hall
    adapter: jsonld
    name: Globe Hall (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://globehall.com/
    expect_min_records: 8
    notes: Rockhouse WordPress; Event JSON-LD per event page with the Etix ticket link.
    params:
      urls: [https://globehall.com/]
      follow: 'globehall\.com/event/[^/]+/globe-hall/denver-colorado/$'
      max_follow: 40
      venue: {name: Globe Hall}
      organizer: Globe Hall
      default_category: music.concert
  - id: lost_lake
    adapter: jsonld
    name: Lost Lake Lounge (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://lost-lake.com/
    expect_min_records: 8
    notes: Rockhouse WordPress; Event JSON-LD per event page with the Etix ticket link.
    params:
      urls: [https://lost-lake.com/]
      follow: 'lost-lake\.com/event/[^/]+/lost-lake/denver-colorado/$'
      max_follow: 40
      venue: {name: Lost Lake Lounge}
      organizer: Lost Lake Lounge
      default_category: music.concert
  # ── session 2: Denver / Seattle / Austin coverage (2026-10-16; docs/SOURCES.md "session 2") ──
  - id: jeffco_library_events
    adapter: bibliocommons
    name: Jefferson County Public Library events
    data_type: events
    cadence_hours: 24
    homepage: https://jeffcolibrary.bibliocommons.com/v2/events
    expect_min_records: 40
    notes: >-
      BiblioCommons events RSS (gateway host, no robots.txt). Branches in Lakewood, Arvada, Wheat Ridge, Golden,
      Edgewater and Littleton only; the mountain branches (Evergreen, Conifer) are outside the city radius.
    params:
      library: jeffcolibrary
      horizon_days: 10
      max_pages: 20
      venue_label: Jefferson County Public Library
      cities: [Lakewood, Arvada, Wheat Ridge, Golden, Edgewater, Littleton]
      default_category: arts.books
      category_map:   # labels seen in the live feed; checked in this order (event types before audiences)
        Story Times: family.kids
        Book Club: arts.books
        Writing: arts.books
        DIY and Crafting: arts.workshop
        Science and Technology: learning.tech
        Babies: family.kids
        Toddlers: family.kids
        Preschoolers: family.kids
        School Age: family.kids
        Tweens: family.kids
  - id: arapahoe_library_events
    adapter: bibliocommons
    name: Arapahoe Libraries events
    data_type: events
    cadence_hours: 24
    homepage: https://arapahoelibraries.bibliocommons.com/v2/events
    expect_min_records: 30
    notes: >-
      BiblioCommons events RSS. Branches in Centennial, Englewood, Littleton, Sheridan and the Denver-addressed
      branches (Eloise May, Sheridan); the far-east rural branches (Deer Trail, Byers) are dropped by `cities`.
    params:
      library: arapahoelibraries
      horizon_days: 10
      max_pages: 20
      venue_label: Arapahoe Libraries
      cities: [Centennial, Denver, Englewood, Littleton, Sheridan, Greenwood Village, Aurora]
      exclude_location: '\b(Board of Trustees|Trustees Meeting)\b'   # governance meetings, not events
      default_category: arts.books
      category_map:   # labels seen in the live feed; checked in this order (event types before audiences)
        Storytimes: family.kids
        "Book & Movie Clubs": arts.books
        "Literature & Writing": arts.books
        "Authors & Speakers": arts.books
        "Crafts & Hobbies": arts.workshop
        Language Learning: learning.language
        Computer Classes: learning.tech
        "Technology & Innovation": learning.tech
        "Children (0–5)": family.kids
        "Kids (5–8)": family.kids
        "Tweens (9–12)": family.kids
  - id: cervantes_denver
    adapter: jsonld
    name: Cervantes' Masterpiece Ballroom & Other Side (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://cervantesmasterpiece.com/
    expect_min_records: 15
    notes: >-
      Rockhouse WordPress (like Larimer Lounge); Event JSON-LD per event page with the Etix ticket link. The
      homepage also lists shows the promoter books elsewhere (Ogden, Mission Ballroom, Red Rocks, Steamboat);
      `follow` keeps Denver-addressed rooms only.
    params:
      urls: [https://cervantesmasterpiece.com/]
      follow: 'cervantesmasterpiece\.com/event/[^/]+/cervantes[^/]*/denver-colorado/$'
      max_follow: 40
      venue: {name: "Cervantes' Masterpiece Ballroom", address: "2637 Welton St, Denver, CO 80205"}
      organizer: Cervantes' Masterpiece
      default_category: music.concert
  - id: denver_arts_venues
    adapter: rss_events
    name: Denver Arts & Venues — Denver Performing Arts Complex (Boettcher, Buell, Ellie Caulkins, Dazzle, DCPA)
    data_type: concerts
    cadence_hours: 24
    homepage: https://www.artscomplex.com/events
    expect_min_records: 40
    notes: >-
      City-owned venues' carbonhouse events RSS (/events/rss, ev: module; robots allows all). Covers the
      Colorado Symphony at Boettcher, Broadway at the Buell, DCPA theatres and Dazzle jazz club (whose own site
      serves a Cloudflare challenge — this feed is the city's syndication, not a workaround).
    params:
      url: https://www.artscomplex.com/events/rss
      horizon_days: 120
      venue: {name: Denver Performing Arts Complex, address: "1400 Curtis St, Denver, CO 80202"}
      venues: {"Dazzle": "1512 Curtis St, Denver, CO 80202"}
      organizer: Denver Arts & Venues
      default_category: music.concert
      category_map:   # ev:location rooms seen in the live feed (then title keywords)
        Opening Night: arts.theater   # "Opening Night Dinner" is a gala, not a bar opening
        Boettcher Concert Hall: music.classical
        Dazzle: music.concert
        Buell Theatre: arts.theater
        Ellie Caulkins Opera House: arts.theater
        Studio Loft of the Ellie Caulkins Opera House: arts.theater
        Kilstrom Theatre: arts.theater
        Wolf Theatre: arts.theater
        Space Theatre: arts.theater
        Garner Galleria Theatre: arts.theater
        Randy Weeks Conservatory Theatre: arts.theater
  - id: denver_coliseum
    adapter: rss_events
    name: Denver Coliseum (Denver Arts & Venues)
    data_type: events
    cadence_hours: 24
    homepage: https://www.denvercoliseum.com/events
    expect_min_records: 5
    notes: City-owned arena's carbonhouse events RSS (rodeo, high-school championships, shows). robots allows all.
    params:
      url: https://www.denvercoliseum.com/events/rss
      horizon_days: 150
      venue: {name: Denver Coliseum, address: "4600 Humboldt St, Denver, CO 80216"}
      organizer: Denver Arts & Venues
      default_category: sports_watch.game
  - id: denver_pioneers_athletics
    adapter: ics
    name: Denver Pioneers athletics (home games — hockey at Magness Arena, basketball, soccer, gymnastics)
    data_type: events
    cadence_hours: 24
    homepage: https://denverpioneers.com/calendar
    expect_min_records: 8
    notes: >-
      University of Denver's SIDEARM Sports subscription calendar (calendar.ashx/calendar.ics; robots allows it).
      Only events whose LOCATION starts with "Denver" are kept (away/neutral games skipped).
    params:
      url: https://denverpioneers.com/calendar.ashx/calendar.ics?sport_id=0
      horizon_days: 45
      max_occurrences: 1
      organizer: Denver Pioneers
      exclude_location: '^(?!Denver\b)'
      force_category: sports_watch.game   # spectator games, not rec leagues
      fallback_point: { lat: 39.6766, lon: -104.9619, label: "University of Denver campus" }
