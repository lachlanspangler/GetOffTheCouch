# Austin, TX. Neighborhood points are approximate centroids, used only for "near me" distance filters.
# Sources verified live 2026-10-15/16 (see docs/research/city_open_data.md §3.5 and docs/SOURCES.md).
slug: austin
name: Austin
state: TX
timezone: America/Chicago
center: [30.2672, -97.7431]
radius_km: 25
aliases: [ATX, Round Rock, Cedar Park, Pflugerville, Georgetown, Buda, Kyle, Lakeway, Bee Cave, Manor]
neighborhoods:  # approximate centroids
  - { name: Downtown, lat: 30.2672, lon: -97.7431 }
  - { name: Rainey Street, lat: 30.2590, lon: -97.7390 }
  - { name: East Austin, lat: 30.2630, lon: -97.7200 }
  - { name: East Cesar Chavez, lat: 30.2560, lon: -97.7270 }
  - { name: South Congress (SoCo), lat: 30.2490, lon: -97.7500 }
  - { name: Zilker / Barton Springs, lat: 30.2620, lon: -97.7700 }
  - { name: Bouldin Creek, lat: 30.2500, lon: -97.7580 }
  - { name: South Lamar, lat: 30.2450, lon: -97.7750 }
  - { name: Hyde Park, lat: 30.3050, lon: -97.7290 }
  - { name: West Campus / UT, lat: 30.2850, lon: -97.7450 }
  - { name: Mueller, lat: 30.2990, lon: -97.7050 }
  - { name: North Loop, lat: 30.3170, lon: -97.7230 }
  - { name: Clarksville, lat: 30.2820, lon: -97.7600 }
  - { name: The Domain, lat: 30.4020, lon: -97.7250 }
  - { name: Montopolis, lat: 30.2330, lon: -97.6990 }
sources:
  - id: visit_austin_events
    adapter: simpleview
    name: Visit Austin events
    data_type: events
    homepage: https://www.austintexas.org/events/
    expect_min_records: 50
    enabled: false
    notes: >-
      DISABLED 2026-10-16: the events API answered HTTP 403 "Access Denied" (CDN bot protection) to our PoliteClient on the first live run, although robots.txt allows it and the token endpoint worked. A 403 means the site doesn't want automated clients here; we don't work around it. Re-enable only with the board's permission.
    params:
      base_url: https://www.austintexas.org
      board: Visit Austin
      horizon_days: 7
      default_category: community.festival

  - id: austin_convention_center_events
    adapter: socrata
    name: Austin Convention Center & Palmer Events Center bookings
    data_type: conventions
    homepage: https://datahub.austintexas.gov/d/p9ma-z6y9
    expect_min_records: 5
    params:
      domain: datahub.austintexas.gov
      dataset: p9ma-z6y9
      horizon_days: 365
      where: "arrive_date >= '{today}' AND arrive_date < '{horizon}'"
      order: arrive_date
      all_day: true
      fields: { title: event_name, start: arrive_date, end: depart_date, venue: location, url: website,
                attendance: attendance }
      # many bookings are closed industry meetings; keep the public-facing shows, fairs and festivals
      exclude_title: ["(?i)\\b(meeting|conference|summit|symposium|congress|graduation|commencement|exam|training|board)\\b"]
      default_category: other.uncategorized

  - id: utaustin_events
    adapter: localist
    name: UT Austin events
    data_type: events
    homepage: https://calendar.utexas.edu/
    expect_min_records: 20
    params:
      fallback_point: { lat: 30.2862, lon: -97.7394, label: "UT Austin main campus" }   # unmappable rooms → campus, labeled approximate
      exclude_location: '\b(Okla|Calif|Ariz|Kan|Ark|Ala|Miss|Fla|Ga|La|Colo|Neb|Tenn|Ky|Ind|Mich|Wis|Minn|Ore|Wash|Va|Md|Pa|Mass|Conn)\.|\b(N\.M|N\.C|S\.C|W\.Va|N\.Y)\.|\b(Lubbock|Waco|Fort Worth|Stillwater|Norman|Bakersfield|Fayetteville|Ames)\b'   # away games (AP state abbreviations always end in a period)
      audience_filter: institution   # skip faculty/student-only items
      base_url: https://calendar.utexas.edu
      horizon_days: 30
      max_pages: 6
      organizer: The University of Texas at Austin
      default_category: learning.networking

  - id: tabc_pending_openings_austin
    adapter: socrata
    name: TABC pending original on-premises applications (Austin)
    data_type: openings
    homepage: https://data.texas.gov/d/mxm5-tdpj
    expect_min_records: 5
    notes: >-
      Original (not renewal) applications. MB = mixed beverage, BG = wine & beer on-premise, BE = beer on-premise.
      gun_sign RED = 51%+ of revenue from alcohol (a bar). The owner column is dropped (may be a person).
    params:
      domain: data.texas.gov
      dataset: mxm5-tdpj
      kind: opening
      lookback_days: 60
      where: "city='Austin' AND license_type in('MB','BG','BE') AND submission_date >= '{today}'"
      order: submission_date DESC
      fields: { record_id: primary_license_id, title: trade_name, start: submission_date, category: gun_sign,
                address: [address, address_2, city, zip] }
      exclude_title: ["(?i)\\b(grocery|food mart|convenience|supermarket|gas station|liquor store)\\b"]
      title_template: "{title} — new liquor license application"
      description_template: >-
        License signal, not a confirmed opening date. The Texas Alcoholic Beverage Commission received an original
        {license_type} on-premises license application for this address on {date} (status: {applicationstatus}).
      category_map: { RED: nightlife.opening }
      default_category: food_drink.restaurant_opening
      default_url: https://data.texas.gov/d/mxm5-tdpj
      extras: { signal: liquor_license_application }

  - id: tabc_new_licenses_austin
    adapter: socrata
    name: TABC newly issued on-premises licenses (Austin)
    data_type: openings
    homepage: https://data.texas.gov/d/7hf9-qc9f
    expect_min_records: 5
    notes: original_issue_date = first issuance (not current_issued_date, which moves on renewal).
    params:
      domain: data.texas.gov
      dataset: 7hf9-qc9f
      kind: opening
      lookback_days: 60
      where: "upper(city)='AUSTIN' AND license_type in('MB','BG','BE') AND original_issue_date >= '{today}'"
      order: original_issue_date DESC
      fields: { record_id: license_id, title: trade_name, start: original_issue_date, category: gun_sign,
                address: [address, address_2, city, zip] }
      exclude_title: ["(?i)\\b(grocery|food mart|convenience|supermarket|gas station|liquor store)\\b"]
      title_template: "{title} — new liquor license"
      description_template: >-
        License signal, not a confirmed opening date. The Texas Alcoholic Beverage Commission first issued a
        {license_type} on-premises license for this address on {date}.
      category_map: { RED: nightlife.opening }
      default_category: food_drink.restaurant_opening
      default_url: https://data.texas.gov/d/7hf9-qc9f
      extras: { signal: liquor_license_issued }

  # ── leagues / volunteering / Luma (merged from the adapters branch; see docs/sources_additions.md) ──
  - id: uw_austin_volunteer
    adapter: handsonconnect
    name: United Way for Greater Austin
    data_type: volunteer
    min_interval_s: 3
    homepage: https://volunteer.uwatx.org/calendar
    expect_min_records: 0
    notes: Empty calendar on 2026-10-16; the code==200/items check in fetch still catches endpoint breakage.
    params:
      base_url: https://volunteer.uwatx.org
      block_id: 447
      horizon_days: 14
      window_days: 3
  - id: luma_atx_backgammon
    adapter: ics
    name: ATX Backgammon Club (Luma)
    data_type: recurring
    cadence_hours: 12
    homepage: https://luma.com/austin
    expect_min_records: 0
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-rwQQdIctP4pVyr7
      horizon_days: 45
      organizer: ATX Backgammon Club
      default_category: trivia_games.board_games

  - id: curated_austin
    adapter: curated
    name: GetOffTheCouch curated (verified by hand)
    data_type: leagues
    cadence_hours: 24      # page-watch re-verifies quotes daily
    sla_hours: 336         # an entry unverified for 2 weeks shows as stale
    min_interval_s: 3
    expect_min_records: 1
    notes: config/registry/austin.yaml (evidence-quoted entries; page-watch checks the quotes still exist)
  # ── concerts: venues' own public calendars (keyless; research 2026-10-16, docs/sources_concerts.md) ──
  - id: saxon_pub
    adapter: tribe
    name: The Saxon Pub (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://thesaxonpub.com/events/
    expect_min_records: 10
    notes: The Events Calendar REST API (robots only blocks add-to-cart/uploads).
    params:
      base_url: https://thesaxonpub.com
      horizon_days: 60
      per_page: 50
      max_pages: 6
      organizer: The Saxon Pub
      default_category: music.concert
      classify_description: false
  - id: carousel_lounge
    adapter: tribe
    name: Carousel Lounge (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://carousellounge.com/calendar/
    expect_min_records: 3
    notes: The Events Calendar REST API (robots allows everything).
    params:
      base_url: https://carousellounge.com
      horizon_days: 60
      per_page: 50
      max_pages: 4
      organizer: Carousel Lounge
      default_category: music.concert
      classify_description: false
  # ── session 2: Denver / Seattle / Austin coverage (2026-10-16; docs/SOURCES.md "session 2") ──
  - id: flamingo_cantina
    adapter: tribe
    name: Flamingo Cantina (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://flamingocantina.com/calendar/
    expect_min_records: 3
    notes: The Events Calendar REST API (robots allows it). Reggae/hip-hop room on Sixth Street.
    params:
      base_url: https://flamingocantina.com
      horizon_days: 60
      per_page: 50
      max_pages: 3
      organizer: Flamingo Cantina
      venue: {name: Flamingo Cantina, address: "515 E 6th St, Austin, TX 78701"}   # some events carry no venue
      default_category: music.concert
      classify_description: false
  - id: wildflower_center_events
    adapter: tribe
    name: Lady Bird Johnson Wildflower Center events
    data_type: events
    cadence_hours: 24
    min_interval_s: 2
    homepage: https://www.wildflower.org/events
    expect_min_records: 10
    notes: UT Austin's botanic garden; The Events Calendar REST API (robots allows it).
    params:
      base_url: https://www.wildflower.org
      horizon_days: 45
      per_page: 50
      max_pages: 4
      organizer: Lady Bird Johnson Wildflower Center
      default_category: outdoors.park
      classify_description: false
      exclude_location: '\bMembers? Only\b'   # member-only previews aren't open to newcomers
      category_map:   # The Events Calendar categories seen live (first match in the event's category order wins)
        Tuesday Twilights: music.concert
        Yoga FIT: fitness.yoga
        Get FIT: fitness
        Family Birding: outdoors.hike
        Homeschool Days: family.kids
        Youth Programs: family.kids
        Tour: outdoors.park
        Wellness: fitness
  - id: contemporary_austin_events
    adapter: tribe
    name: The Contemporary Austin events
    data_type: events
    cadence_hours: 24
    min_interval_s: 2
    homepage: https://thecontemporaryaustin.org/
    expect_min_records: 3
    notes: >-
      The Events Calendar REST API answered 200 to our client (robots allows /wp-json/); the HTML pages serve a
      Cloudflare challenge, which we never attempt. If the API starts challenging too, the unit fails and stays off.
    params:
      base_url: https://thecontemporaryaustin.org
      horizon_days: 60
      per_page: 50
      max_pages: 2
      organizer: The Contemporary Austin
      default_category: arts.museum
      classify_description: false
      exclude_location: '\bMembers? (Only|Curator)'   # member-only programs
      category_map:   # The Events Calendar categories seen live
        Tours: arts.museum
        Talk: arts.books
        Music: music.concert
        Art Making: arts.workshop
        Workshop: arts.workshop
        Families: family.kids
        Exhibitions: arts.museum
  - id: austin_parks_foundation_events
    adapter: jsonld
    name: Austin Parks Foundation events
    data_type: events
    cadence_hours: 24
    min_interval_s: 2
    homepage: https://austinparks.org/event-calendar/
    expect_min_records: 8
    notes: >-
      Modern Events Calendar page with ~30 Event JSON-LD records (dates only → all-day): park volunteer days,
      free concerts and movies in parks. offers.validFrom is the event date (a placeholder), so it isn't trusted.
    params:
      urls: [https://austinparks.org/event-calendar/]
      organizer: Austin Parks Foundation
      default_category: outdoors.park
      trust_valid_from: false
      classify_description: true
  - id: acl_live
    adapter: rss_events
    name: ACL Live at The Moody Theater & 3TEN (venue calendar)
    data_type: concerts
    cadence_hours: 12
    homepage: https://www.acllive.com/events
    expect_min_records: 30
    notes: >-
      carbonhouse events RSS (/events/rss, ev: module with UTC start times); robots allows all; the site's terms
      (Ryman Hospitality) have no automated-access clause. Tickets are AXS (no face-value price in the feed).
    params:
      url: https://www.acllive.com/events/rss
      horizon_days: 180
      venue: {name: ACL Live at The Moody Theater, address: "310 W Willie Nelson Blvd, Austin, TX 78701"}
      organizer: ACL Live
      default_category: music.concert
  - id: heb_center
    adapter: rss_events
    name: H-E-B Center at Cedar Park (Texas Stars, Austin Spurs, concerts)
    data_type: events
    cadence_hours: 24
    homepage: https://www.hebcenter.com/events
    expect_min_records: 15
    notes: "City of Cedar Park's arena; carbonhouse events RSS (/events/rss with the ev: module). robots allows it."
    params:
      url: https://www.hebcenter.com/events/rss
      horizon_days: 120
      venue: {name: H-E-B Center at Cedar Park, address: "2100 Avenue of the Stars, Cedar Park, TX 78613"}
      organizer: H-E-B Center
      default_category: music.concert
      category_map:   # title keywords
        " vs": sports_watch.game
        "Texas Stars": sports_watch.game
        "Austin Spurs": sports_watch.game
  - id: cap_city_comedy
    adapter: jsonld
    name: Cap City Comedy Club (club calendar)
    data_type: events
    cadence_hours: 24
    min_interval_s: 2
    homepage: https://www.capcitycomedy.com/
    expect_min_records: 20
    notes: >-
      The homepage carries one Event JSON-LD record per show (~260, UTC start times; no offers). robots.txt allows
      everything and the terms have no automated-access clause. One page per run.
    params:
      urls: [https://www.capcitycomedy.com/]
      horizon_days: 45
      organizer: Cap City Comedy Club
      default_category: nightlife.comedy
      category_map: {Event: nightlife.comedy}   # every record is a stand-up show
