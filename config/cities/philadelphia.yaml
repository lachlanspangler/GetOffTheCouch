# Batch A onboarding, sources verified live 2026-10-16 (docs/SOURCES.md "Batch A cities").
# Not used: Free Library of Philadelphia (freelibrary.org robots.txt → 403 = disallow all); Center City District,
# University City District, Penn Today, Mann Center (robots.txt → 403); Penn/Temple/Drexel event calendars (no
# Localist/LiveWhale API found); Union Transfer, Ensemble Arts Philly (no Event JSON-LD); Live Nation houses (The
# Fillmore, Franklin Music Hall, The Met, Punch Line); no Team Trivia / Challenge market and no Galaxy Digital
# volunteer tenant found (uwgpsnj, phillyvolunteers, philadelphia → "Bad Domain").
