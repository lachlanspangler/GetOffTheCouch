sources:
  # ── openings: City of Philadelphia L&I business licenses (Carto SQL API, CSV) ──
  - id: phl_restaurant_openings
    adapter: csvfile
    name: Philadelphia new food-service business licenses (L&I)
    data_type: openings
    homepage: https://opendataphilly.org/datasets/licenses-and-inspections-business-licenses/
    expect_min_records: 20
    notes: >-
      OpenDataPhilly's L&I business licenses served by the city's Carto SQL API (phl.carto.com; robots disallows
      /api/ only for named search crawlers, not for `*`). The query selects only non-personal columns and
      "Food Preparing and Serving" licenses first issued in the last 60 days (initialissuedate = first issue, not
      renewal). legalname may be a person, so it's only a title fallback when it looks like an organisation.
    params:
      url: https://phl.carto.com/api/v2/sql?format=csv&q=SELECT%20licensenum,%20business_name,%20legalname,%20licensetype,%20address,%20zip,%20initialissuedate,%20licensestatus,%20ST_Y(the_geom)%20AS%20lat,%20ST_X(the_geom)%20AS%20lon%20FROM%20business_licenses%20WHERE%20licensetype%20IN%20('Food%20Preparing%20and%20Serving',%20'Food%20Preparing%20and%20Serving%20(30%2B%20SEATS)')%20AND%20initialissuedate%20>=%20now()%20-%20interval%20'60%20days'%20ORDER%20BY%20initialissuedate%20DESC
      kind: opening
      lookback_days: 60
      window: { field: initialissuedate }
      fields: { record_id: licensenum, title: [business_name, legalname], start: initialissuedate, category: licensetype,
                address: [address, zip], lat: lat, lon: lon }
      entity_only_fields: [legalname]
      exclude_title: ["(?i)\\b(child ?care|day ?care|beginnings|daycare|early learning|learning center|academy|school|charter|church|ministr|hospital|nursing|senior|rehab|food market|mini ?mart|grocery|supermarket|deli & grocery|convenience|gas|catering|vending)\\b"]
      title_template: "{title} — new food-service license"
      description_template: >-
        License signal, not a confirmed opening date. Philadelphia's Department of Licenses & Inspections first
        issued a "{licensetype}" business license for this address on {date}.
      default_category: food_drink.restaurant_opening
      default_url: https://opendataphilly.org/datasets/licenses-and-inspections-business-licenses/
      extras: { signal: business_license_issued }

  # ── gardens / parks ──
  - id: bartrams_garden_events
    adapter: tribe
    name: Bartram's Garden events
    data_type: events
    cadence_hours: 24
    homepage: https://www.bartramsgarden.org/calendar/
    expect_min_records: 10
    notes: The Events Calendar REST API (robots allows it). Farm stands, volunteer days, boating, biking classes.
    params:
      base_url: https://www.bartramsgarden.org
      horizon_days: 45
      per_page: 50
      max_pages: 3
      organizer: Bartram's Garden
      venue: {name: Bartram's Garden, address: "5400 Lindbergh Blvd, Philadelphia, PA 19143"}
      default_category: outdoors.park
      category_map: { Volunteer: volunteer.one_off, Volunteering: volunteer.one_off }

