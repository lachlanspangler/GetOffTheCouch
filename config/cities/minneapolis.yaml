# Minneapolis, MN. Neighborhood points are approximate centroids, used only for "near me" distance filters.
slug: minneapolis
name: Minneapolis
state: MN
timezone: America/Chicago
center: [44.9778, -93.2650]
radius_km: 20
aliases: [Mpls, Twin Cities, St. Paul, Saint Paul, Edina, St Louis Park, Richfield, Bloomington, Golden Valley, Roseville]
neighborhoods:
  - { name: Downtown, lat: 44.9765, lon: -93.2700 }
  - { name: North Loop, lat: 44.9880, lon: -93.2770 }
  - { name: Northeast, lat: 45.0030, lon: -93.2550 }
  - { name: Uptown, lat: 44.9490, lon: -93.2980 }
  - { name: Lyn-Lake, lat: 44.9480, lon: -93.2880 }
  - { name: Loring Park, lat: 44.9690, lon: -93.2840 }
  - { name: Whittier, lat: 44.9560, lon: -93.2780 }
  - { name: Powderhorn, lat: 44.9410, lon: -93.2550 }
  - { name: Longfellow, lat: 44.9400, lon: -93.2200 }
  - { name: Seward, lat: 44.9600, lon: -93.2350 }
  - { name: Dinkytown / U of M, lat: 44.9810, lon: -93.2360 }
  - { name: Linden Hills, lat: 44.9250, lon: -93.3150 }
  - { name: Nokomis, lat: 44.9100, lon: -93.2400 }
  - { name: Near North, lat: 44.9950, lon: -93.3000 }
  - { name: St. Paul (Downtown), lat: 44.9537, lon: -93.0900 }
sources:
  - id: mprb_events
    adapter: tribe
    name: Minneapolis Park & Recreation Board
    data_type: events
    min_interval_s: 6   # returns HTTP 429 after ~3 fast requests (research 2026-10-15)
    homepage: https://www.minneapolisparks.org/event-calendar/
    expect_min_records: 5
    params:
      base_url: https://www.minneapolisparks.org
      horizon_days: 60
      organizer: Minneapolis Park & Recreation Board
      default_category: outdoors.park
      category_map:
        Environmental Volunteer Opportunities: volunteer.one_off
        Volunteer Opportunities: volunteer.one_off
  - id: curated_minneapolis
    adapter: curated
    name: GetOffTheCouch curated (verified by hand)
    data_type: leagues
    cadence_hours: 24      # page-watch re-verifies quotes daily
    sla_hours: 336         # an entry unverified for 2 weeks shows as stale
    min_interval_s: 3
    expect_min_records: 1
    notes: config/registry/minneapolis.yaml — evidence-quoted entries; page-watch checks the quotes still exist

  - id: mpls_downtown_events
    adapter: tribe
    name: Minneapolis Downtown Council events
    data_type: events
    homepage: https://www.mplsdowntown.com/events/
    expect_min_records: 20
    notes: robots disallows only HTML Tribe permutations; the REST API is allowed.
    params:
      base_url: https://www.mplsdowntown.com
      horizon_days: 30
      per_page: 50
      max_pages: 12
      organizer: Minneapolis Downtown Council
      default_category: community.festival

  - id: hclib_events
    adapter: bibliocommons
    name: Hennepin County Library events
    data_type: events
    homepage: https://hclib.bibliocommons.com/v2/events
    expect_min_records: 50
    notes: Countywide system; keep branches in Minneapolis and the inner-ring suburbs only.
    params:
      library: hclib
      horizon_days: 14
      venue_label: Hennepin County Library
      cities: [Minneapolis, Edina, St. Louis Park, Saint Louis Park, Richfield, Golden Valley, Robbinsdale,
               Brooklyn Center, Bloomington, Hopkins, Roseville, Columbia Heights, New Hope, Crystal]
      default_category: arts.books
      category_map:   # labels seen in the live feed; checked in this order (event types before audiences)
        Early Learning and Storytimes: family.kids
        Arts and Crafts: arts.workshop
        Performances and Movies: arts.film
        Writing: arts.books
        Babies: family.kids
        Toddlers: family.kids
        Preschoolers: family.kids
        Kids: family.kids

  - id: umn_events
    adapter: livewhale
    name: University of Minnesota events
    data_type: events
    homepage: https://events.tc.umn.edu/
    expect_min_records: 20
    params:
      fallback_point: { lat: 44.974, lon: -93.2277, label: "University of Minnesota East Bank" }   # unmappable rooms → campus, labeled approximate
      audience_filter: institution   # skip faculty/student-only items
      base_url: https://events.tc.umn.edu
      max: 200
      organizer: University of Minnesota
      default_category: learning.networking

  # ── volunteer: Galaxy Digital "Get Connected" (HandsOn Twin Cities). RSS = discovery, detail pages = records.
  - id: handson_twin_cities
    adapter: galaxydigital
    name: HandsOn Twin Cities
    data_type: volunteer
    min_interval_s: 3
    homepage: https://handsontwincities.galaxydigital.com/need/
    expect_min_records: 1
    params:
      base_url: https://handsontwincities.galaxydigital.com
      max_details: 15
      max_shifts: 6

  # ── Luma public calendars (ICS). Found via luma.com/minneapolis __NEXT_DATA__ (2026-10-16); org calendars only,
  #    never "Personal" ones. api.lu.ma robots: only /insights/ disallowed. Feeds say REFRESH-INTERVAL PT12H.
  - id: luma_zoma_house
    adapter: ics
    name: ZOMA House (Luma)
    data_type: events
    cadence_hours: 12
    homepage: https://luma.com/minneapolis
    expect_min_records: 1
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-ZcUa89sLSrEvGwZ
      horizon_days: 60
      organizer: ZOMA House
      default_category: community.cultural
  - id: luma_mpls_journaling_club
    adapter: ics
    name: Minneapolis Journaling Club (Luma)
    data_type: events
    cadence_hours: 12
    homepage: https://luma.com/minneapolis
    expect_min_records: 0
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-vIvBKQ0GdZ1C2hH
      horizon_days: 60
      organizer: Minneapolis Journaling Club
      default_category: arts.workshop
  - id: luma_minnestar
    adapter: ics
    name: Minnestar (Luma)
    data_type: events
    cadence_hours: 12
    homepage: https://minnestar.org/
    expect_min_records: 0
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-tXboXaBmfSTKWBC
      horizon_days: 60
      organizer: Minnestar
      default_category: learning.tech
  - id: luma_sew_it_together
    adapter: ics
    name: Sew It Together (Luma)
    data_type: events
    cadence_hours: 12
    homepage: https://luma.com/minneapolis
    expect_min_records: 1
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-mu5aaSRoSxi1ZRK
      horizon_days: 30
      max_occurrences: 4
      organizer: Sew It Together
      default_category: arts.workshop

  - id: mpls_on_sale_liquor_openings
    adapter: arcgis
    name: Minneapolis new on-sale liquor licenses
    data_type: openings
    cadence_hours: 24
    homepage: https://services.arcgis.com/afSMGVsC7QlRK1kZ/arcgis/rest/services/On_Sale_Liquor/FeatureServer/0
    expect_min_records: 50
    notes: >-
      No original-issue date in this dataset (issueDate changes on renewal), so newness = first seen by us
      after the initial snapshot (openings_by_first_seen; I-058). The first run is a silent baseline.
    params:
      service_url: https://services.arcgis.com/afSMGVsC7QlRK1kZ/arcgis/rest/services/On_Sale_Liquor/FeatureServer/0
      kind: opening
      openings_by_first_seen: true
      id_includes_start: false
      where: "licenseStatus = 'Approved'"
      order_by: licenseNumber
      fields: { record_id: licenseNumber, title: licenseName, start: issueDate, category: endorsements,
                address: [address], lat: lat, lon: long, neighborhood: neighborhood }
      title_template: "{title} — new liquor license"
      description_template: >-
        License signal, not a confirmed opening date. The City of Minneapolis lists an approved on-sale
        liquor license for this address ({endorsements}).
      default_category: food_drink.restaurant_opening
      default_url: https://www.minneapolismn.gov/business-services/licenses-permits-inspections/business-licenses/liquor-beer-wine/
      extras: { signal: liquor_license_first_seen }
  # ── concerts: venues' own public calendars (keyless; research 2026-10-16, docs/sources_concerts.md) ──
  - id: icehouse_mpls
    adapter: jsonld
    name: Icehouse (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://www.icehousempls.com/shows/
    expect_min_records: 10
    notes: WordPress; MusicEvent JSON-LD on each /shows/ page with face-value price + availability (gobo.show tickets).
    params:
      urls: [https://www.icehousempls.com/shows/]
      follow: 'icehousempls\.com/shows/[^/?#]+/$'
      max_follow: 40
      venue: {name: Icehouse}
      organizer: Icehouse
      default_category: music.concert
  - id: hook_and_ladder
    adapter: jsonld
    name: The Hook and Ladder Theater (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://www.thehookmpls.com/events/
    expect_min_records: 10
    notes: Opendate-powered site; MusicEvent JSON-LD per show. offers.validFrom is the page render time, so it is ignored.
    params:
      urls: [https://www.thehookmpls.com/events/]
      follow: 'thehookmpls\.com/shows/[^/?#]+$'
      max_follow: 40
      trust_valid_from: false
      venue: {name: The Hook and Ladder Theater}
      organizer: The Hook and Ladder Theater
      default_category: music.concert
  - id: cedar_cultural_center
    adapter: jsonld
    name: The Cedar Cultural Center (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://www.thecedar.org/events
    expect_min_records: 10
    notes: >-
      Squarespace; Event JSON-LD on each event page (no offers). robots disallows ?format=json/ical
      (wildcard rules Python's robotparser can't evaluate), so `follow` only matches query-less event URLs.
    params:
      urls: [https://www.thecedar.org/events]
      follow: 'thecedar\.org/events/[^/?#]+$'
      max_follow: 40
      venue: {name: The Cedar Cultural Center}
      organizer: The Cedar Cultural Center
      default_category: music.concert
  - id: dakota_jazz
    adapter: tribe
    name: Dakota (venue calendar)
    data_type: concerts
    cadence_hours: 12
    min_interval_s: 2
    homepage: https://www.dakotacooks.com/events/
    expect_min_records: 10
    notes: The Events Calendar REST API (robots allows everything).
    params:
      base_url: https://www.dakotacooks.com
      horizon_days: 90
      per_page: 50
      max_pages: 6
      organizer: Dakota
      default_category: music.concert
      classify_description: false

  # ── big venues via carbonhouse /events/rss (public syndication feed; robots allows; session 2, I-104) ──
  - id: target_center
    adapter: rss_events
    name: Target Center (venue calendar)
    data_type: concerts
    cadence_hours: 12
    homepage: https://www.targetcenter.com/events
    expect_min_records: 10
    params:
      url: https://www.targetcenter.com/events/rss
      horizon_days: 180
      venue: {name: "Target Center", address: "600 N 1st Ave, Minneapolis, MN 55403"}
      organizer: Target Center
      default_category: music.concert
  - id: grand_casino_arena
    adapter: rss_events
    name: Grand Casino Arena (venue calendar)
    data_type: concerts
    cadence_hours: 12
    homepage: https://www.grandcasinoarena.com/events
    expect_min_records: 10
    params:
      url: https://www.grandcasinoarena.com/events/rss
      horizon_days: 180
      venue: {name: "Grand Casino Arena", address: "199 W Kellogg Blvd, St Paul, MN 55102"}
      organizer: Grand Casino Arena
      default_category: music.concert

  # ── college athletics, home games only (SIDEARM calendar.ics; robots allows; session 2, I-107) ──
  - id: gophers_athletics
    adapter: ics
    name: Minnesota Golden Gophers athletics (home games)
    data_type: events
    cadence_hours: 24
    homepage: https://gophersports.com/calendar
    expect_min_records: 3
    params:
      url: https://gophersports.com/calendar.ashx/calendar.ics?sport_id=0
      horizon_days: 45
      max_occurrences: 1
      organizer: Minnesota Athletics
      force_category: sports_watch.game
      exclude_location: '^(?!(Minneapolis)\b)'
