# Pending sources for miami (config/cities/miami.yaml is being created by another agent).
# Merge: append these entries to the city file's `sources:` list. Same SourceConfig schema.
sources:
  - id: volo_miami
    adapter: volo
    name: Volo Sports Miami
    data_type: leagues
    min_interval_s: 3
    homepage: https://www.volosports.com/discover/miami?category=leagues
    expect_min_records: 1
    params:
      base_url: https://www.volosports.com
      city_slug: miami
      max_pages: 4
  - id: luma_mana_tech
    adapter: ics
    name: Mana Tech Events (Luma)
    data_type: events
    cadence_hours: 12
    homepage: https://luma.com/miami
    expect_min_records: 1
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-NgTwepzMKeP3Xlg
      horizon_days: 45
      organizer: Mana Tech
      default_category: learning.tech
  - id: luma_run_gables
    adapter: ics
    name: RUN GABLES (Luma)
    data_type: recurring
    cadence_hours: 12
    homepage: https://luma.com/miami
    expect_min_records: 1
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-GC5KnPoGH2C76rp
      horizon_days: 45
      organizer: RUN GABLES
      default_category: fitness.run_club
