# Pending sources for boston (config/cities/boston.yaml is being created by another agent).
# Merge: append these entries to the city file's `sources:` list. Same SourceConfig schema.
sources:
  - id: volo_boston
    adapter: volo
    name: Volo Sports Boston
    data_type: leagues
    min_interval_s: 3
    homepage: https://www.volosports.com/discover/boston?category=leagues
    expect_min_records: 1
    params:
      base_url: https://www.volosports.com
      city_slug: boston
      include_fees: true      # Volo 307-redirects Boston to includeFees=true; asking for it keeps ?page=N
      max_pages: 6
  - id: boston_cares
    adapter: handsonconnect
    name: Boston Cares
    data_type: volunteer
    min_interval_s: 3
    homepage: https://www.bostoncares.org/calendar
    expect_min_records: 1
    params:
      base_url: https://www.bostoncares.org
      block_id: 589             # <input name="calendar-search-block-id"> on /calendar (verified 2026-10-16)
      horizon_days: 14
      window_days: 2
  - id: luma_startup_boston
    adapter: ics
    name: Startup Boston (Luma)
    data_type: events
    cadence_hours: 12
    homepage: https://luma.com/boston
    expect_min_records: 1
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-BI22W7AXNavDI82
      horizon_days: 60
      organizer: Startup Boston
      default_category: learning.networking
