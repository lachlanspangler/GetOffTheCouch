# Pending sources for austin (config/cities/austin.yaml is being created by another agent).
# Merge: append these entries to the city file's `sources:` list. Same SourceConfig schema.
sources:
  - id: uw_austin_volunteer
    adapter: handsonconnect
    name: United Way for Greater Austin
    data_type: volunteer
    min_interval_s: 3
    homepage: https://volunteer.uwatx.org/calendar
    expect_min_records: 0   # calendar returned 0 items for 14 days on 2026-10-16 (with and without block id)
    notes: "Empty calendar on 2026-10-16; the code==200/items check in fetch still catches endpoint breakage."
    params:
      base_url: https://volunteer.uwatx.org
      block_id: 447           # without a block id this tenant returns 0 items
      horizon_days: 14
      window_days: 3
  - id: luma_atx_backgammon
    adapter: ics
    name: ATX Backgammon Club (Luma)
    data_type: recurring
    cadence_hours: 12
    homepage: https://luma.com/austin
    expect_min_records: 0
    params:
      url: https://api.lu.ma/ics/get?entity=calendar&id=cal-rwQQdIctP4pVyr7
      horizon_days: 45
      organizer: ATX Backgammon Club
      default_category: trivia_games.board_games
