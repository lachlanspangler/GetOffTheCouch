<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Get Off the Couch · Your city, made easy</title>
    <meta name="description" content="Everything worth leaving the house for in your city, and every deadline you'd otherwise miss: rec leagues, block parties, concerts with prices, volunteering, trivia, cons and faires. From official sources, checked every few hours." />
    <meta name="theme-color" content="#FCFBF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231F1D1A'/><path d='M10 25V14a6 6 0 0 1 12 0v11M7 25h18' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>" />
    <link rel="preload" href="%BASE_URL%fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%BASE_URL%fonts/newsreader-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Resolve the theme before first paint, so dark mode never flashes light.
      (function () {
        var t = null;
        try { t = JSON.parse(localStorage.getItem("gotc:theme") || "null"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding:24px;font-family:system-ui">Get Off the Couch needs JavaScript for search and filters. City and event pages work without it once they're pre-rendered.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
