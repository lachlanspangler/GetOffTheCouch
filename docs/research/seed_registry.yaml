# GetOffTheCouch seed registry: leagues/clubs, volunteer orgs, niche events.
# Generated 2026-10-15 by research pass (see docs/research/leagues_volunteer_niche.md).
#
# Rules:
#  - Every entry was reached by a live fetch on `checked` (UA "GetOffTheCouch-research/0.1").
#    Entries whose page could not be read (403/Cloudflare) say so in `notes`; they need a human check.
#  - `season_text` is a VERBATIM quote from `season_source_url` ("..." marks elisions).
#    Empty string = not published / not found. Nothing here is invented or inferred.
#  - `stale: true` marks quotes that are visibly out of date (do not display as current).
#  - `recommendation` values: adapter | permission-gated adapter | curated-page-watch | curated-manual | reject/exclude.
#  - city slugs: minneapolis, miami, los-angeles, chicago, nyc, austin, denver, seattle, nashville, boston.
#
# Sections: leagues (adult rec / curling / bowling), volunteer, niche (cons, faires, trivia, run clubs, maker, car shows).

