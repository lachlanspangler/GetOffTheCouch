 "description": "STG Presents               Maria Bamford           Saturday, Oct. 17, 2026The Neptune Theatre4pm &amp; 8pmDoors one hour priorReserved Seated w/ Standing BarAll Ages, Bar with Valid ID                  Get Tickets         Maria Bamford is revered for her deeply personal and experimental comedy about mental illness. She’s the author of the New York Times bestselling memoir Sure, I’ll Join Your Cult and is the star of four hour-long standup specials (Local Act, Weakness is the Brand, Old Baby and Maria Bamford: the special, special, special!) and the surreal, semi-autobiographical Netflix comedy series Lady Dynamite, about a comedian who suffers a nervous breakdown. Maria was the first female comic to have two half-hour Comedy Central Presents specials and starred alongside Patton Oswalt, Zach Galifianakis and Brian Posehn in The Comedians of Comedy. She also created and starred in the cult hit web series The Maria Bamford Show, in which she plays all the characters.Maria is often recognized for her prolific voiceover work, including characters on Big Mouth and its spinoff Human Resources, HouseBroken, Teenage Euthanasia, Santa, Inc., Bob’s Burgers, Bojack Horseman, Summer Camp Island, Adventure Time, Talking Tom and Friends, Legend of Korra, Puss in Boots, CatDog and PBS’s Emmy-winning series Word Girl. She played DeBrie Bardeaux on Netflix’s Arrested Development and recurred on the ABC hit series Fresh off the Boat. Other TV guest roles include Night Court, Life &amp; Beth, Portlandia, Kenan, Mr. Mayor, and large recurring roles on Hulu’s Everything’s Gonna Be Okay, and Showtime’s Flatbush Misdeameanors. Maria was also Emmy-nominated for her guest appearance on the Netflix children’s series Ask the StoryBots.Maria’s late-night appearances include The Late Show with Stephen Colbert, Late Night with Seth Meyers, CONAN, The Late Late Show with James Corden and The Tonight Show. Her interview series What’s Your Ailment? deals with the various mental struggles of celebrities and is available on the Topic streaming service. Her Audible Original You Are (A Comedy) Special is a semi-mock instructional book for both standup and life.",

 "performer": "",
 "description": "STG Presents &amp; KEXP Welcomes               DJ Shadow Celebrates 30 Years of Endtroducing              Special Guests: DJ D Sharp with King NTG       Saturday, Oct. 17, 2026The Paramount TheatreDoors at 7pmShow at 8pmGeneral Admission Flat Floor &amp; General Admission Balcony                  Get Tickets         For over 30 years, Josh Davis has expressed his passion, taste, and values through the music he creates as DJ Shadow. The name alone evokes a high watermark for instrumental hip-hop and composition. From his first masterpiece Endtroducing…, to the genre-hopping UNKLE release Psyence Fiction, to the otherworldly elegance of The Private Press and its iconic single “Six Days,” to his underrated Bay Area celebration The Outsider, his work in the ’90s and first decade of the 2000s is as essential as it is hard to pin down.In the 2010s, Shadow released the sprawling The Less You Know, the Better, with its muscular forays into rock music, and followed with The Mountain Will Fall and Our Pathetic Age, both ambitious, risk-taking albums that featured collaborations with Run the Jewels, Nas, and De La Soul, among others. Most recently, he returned with Action Adventure, an introspective and cinematic project that reaffirmed his singular approach to sound. If there’s a single red thread across this career, it’s his restless ear—always searching to rescue some forgotten gem from the dustbin of music history or a fresh blast of sound from the cutting edge.It’s a practice Shadow learned as a young boy, enamored with collecting comic books, baseball cards, 12-inch records, and precious songs captured to cassette from the radio airwaves late at night in northern California. With great seriousness and love, he describes the second-hand transistor AM radio on which he first heard Grandmaster Flash and the Furious Five’s “The Message” when he was 10 years old, and his mind-expanding encounter with Public Enemy’s “Rebel Without a Pause” and that single’s howling saxophone blast.At the heart of DJ Shadow’s musical project is deep listening. “I’m always trying to please or impress the most advanced listener,” he says—the type of aficionado who respects the layers upon layers of synths that go into making a sound that can’t be readily identified but makes you want to share it with a friend and say, “This part right here.”Rightly or wrongly, DJ Shadow has never been one to follow anyone else’s musical wants or desires but his own. His career remains a testament to constant evolution, curiosity, and an enduring belief in the art of sound.ABOUT the Endtroducing Tour:You heard right: for the first time EVER, Shadow is  going to be playing a set focusing solely on his groundbreaking 1996 debut album, Endtroducing….. He was ready to do it anyway, but the fact that Endtroducing is turning 30 years old made it a no-brainer.",
 "image": "https://www.stgpresents.org/wp-content/uploads/2026/04/DJ-Shadow-2026-Showpage.jpg",
 "name": "DJ Shadow Celebrates 30 Years of Endtroducing",
 "url": "https://www.stgpresents.org/events/dj-shadow-celebrates-30-years-of-endtroducing/"
 } </script>
