  "name": "KIEFER with Shibo",
  "description": "&lt;p style=&quot;font-weight:400&quot;&gt;10.16 Friday (Jazz / R&amp;B)&lt;br /&gt;Nectar &amp; Earshot Jazz Present:&lt;br /&gt;&lt;strong&gt;KIEFER&lt;/strong&gt;&lt;br /&gt;with Shibo&lt;br /&gt;7pm doors, 21&#043;&lt;br /&gt;&lt;br /&gt;&lt;/p&gt;&lt;p style=&quot;font-weight:400&quot;&gt;Nectar Lounge&lt;br /&gt;412 N 36th St&lt;br /&gt;&lt;a href=&quot;http://www.nectarlounge.com&quot;&gt;www.nectarlounge.com&lt;/a&gt;&lt;/p&gt;&lt;p style=&quot;font-weight:400&quot;&gt; &lt;/p&gt;&lt;p&gt;&lt;strong&gt;Kiefer&lt;/strong&gt; is a central figure in the diverse independent music scene of Los Angeles. His sound fuses various modalities of Black American Music, from jazz and R&amp;B to hip-hop and electronic music.&lt;/p&gt;&lt;p&gt;Kiefer grew up in San Diego, California, immersed in jazz by his father at a young age, and later experimented with hip-hop-inspired beats in high school. While studying jazz piano at UCLA, Kiefer got his education in beats from attending shows at Low End Theory and collaborating with other artists in the scene.&lt;/p&gt;&lt;p&gt;Hard-hitting beats, complex jazz voicings and sentimental melodies all fed into Kiefer\\'s debut, Kickinit Alone, released on Leaving Records in 2017. Soon after, Kiefer signed to Stones Throw and released two LPs: \\'Happysad\\' (2018), and \\'When There\\'s Love Around\\' (2021). His new full-length record, titled \\'It\\'s Ok, B U\\', is available everywhere now.&lt;/p&gt;&lt;p&gt;Outside of his solo work, Kiefer has recorded with artists such as Kaytranada, Sir, and Terrace Martin, and produced for Anderson .Paak on his Grammy Award winning record, &#034;Ventura&#034;.&lt;/p&gt;&lt;p&gt;Kiefer at his core is both emotional and an optimist, which is why his songs resonate on a wide spectrum of emotion. His ethos is about feeling encouraged, empowered, and full of gratitude, reminding listeners through his music, &#034;this is a beautiful life.&#034;&lt;/p&gt;",

  "@context": "http://schema.org",
  "@type": "Event",
  "name": "Logan Richardson: blues PEOPLE with THIEFS",
  "description": "&lt;p style=&quot;font-weight:400&quot;&gt;10.18 Sunday (Jazz / Hip Hop)&lt;br /&gt;Earshot Jazz &amp; Hidden Hall present:&lt;br /&gt;Logan Richardson: blues PEOPLE&lt;br /&gt;THIEFS&lt;br /&gt;7pm doors&lt;br /&gt;8pm show&lt;br /&gt;21&#043;&lt;br /&gt;&lt;br /&gt;&lt;/p&gt;&lt;p&gt;Hidden Hall&lt;br /&gt;400 N 35th St&lt;br /&gt;&lt;a href=&quot;http://hiddenhall.com&quot;&gt;hiddenhall.com&lt;/a&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt;In saxophonist&lt;a href=&quot;https://loganrichardsonstudios.com/logan-richardson/&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt; Logan Richardson’s&lt;/a&gt; own words—&#034;bluesPeople is a sonic ritual—where Black memory, resistance, and imagination collide to create music that doesn’t just perform, but liberates.” Channeling Amiri Baraka\\'s writings on Black music history into a fusion of Kansas City blues, rock, and modern jazz, Richardson’s bluesPeople ensemble is Javier Santiago (keys/synth), Miles Lennox (keys/synth), Frescia Belmar (electric bass), and Ronald Bruner Jr. (drums). &lt;a href=&quot;https://loganrichardson-whirlwind.bandcamp.com/album/afrofuturism&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Afrofuturism&lt;/a&gt; (2021 Whirlwind Recordings) and his most recent album&lt;a href=&quot;https://open.spotify.com/album/0dnC4BwvT64NqqtjW97A0n&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt; Sacred Garden&lt;/a&gt; (2024 WAX Industry) influenced by Charlie Parker shows his fantastic ability to reimagine genre. &lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt; &lt;/em&gt;&lt;/p&gt;&lt;p&gt;&lt;em&gt;Opening is THIEFS, the transatlantic trio led by New York avant-jazz bassist Keith Witty and in-demand saxophonist Christophe Panzani, and rising drummer David Frazier Jr. Since their acclaimed debut in 2013, they have joined forces with poets, spoken word and rap artists in their musical merger of jazz, hip-hop, and electronica. They celebrate their newest release &lt;a href=&quot;https://open.spotify.com/album/1gykhXBWpqjOhXfFRxYQtK?si&#061;1&amp;nd&#061;1&amp;dlsi&#061;f22adce411434004&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Static Culture&lt;/a&gt; (2026).&lt;/em&gt;&lt;/p&gt;",
