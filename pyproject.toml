[project]
name = "getoffthecouch"
version = "0.1.0"
description = "GetOffTheCouch — ur city made easy. Event pipeline + dashboard for people new to a US city."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-dateutil>=2.9",
  "icalendar>=6.0",
  "recurring-ical-events>=3.3",
  "rapidfuzz>=3.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "types-python-dateutil",
  "pre-commit>=3.8",
  "jsonschema>=4.23",
]

[project.scripts]
gotc = "gotc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gotc"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DTZ", "PTH", "N", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003", "PTH123", "N818", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "N802", "E501"]
"gotc/pipeline/deadlines.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["gotc"]

[[tool.mypy.overrides]]
module = ["icalendar.*", "recurring_ical_events.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["live: hits the real internet (excluded by default; run with -m live)"]
